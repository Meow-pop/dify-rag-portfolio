<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>星桥市场调研采集器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">MARKET RESEARCH</p>
      <h1>淘宝当前页采集</h1>
      <p class="hint">先在淘宝完成搜索并滚动加载商品，再点击采集。工具不会自动翻页，也不会读取登录凭证。</p>

      <button id="collect" class="primary" type="button">采集当前页</button>
      <p id="status" class="status" role="status">等待采集</p>

      <section id="summary" class="summary" hidden>
        <div><strong id="count">0</strong><span>件商品</span></div>
        <div><strong id="query">—</strong><span>搜索词</span></div>
      </section>

      <div class="actions">
        <button id="download-json" type="button" disabled>下载 JSON</button>
        <button id="download-csv" type="button" disabled>下载 CSV</button>
      </div>

      <p class="boundary">出现验证码、访问频繁或安全验证时，采集器会停止。</p>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
